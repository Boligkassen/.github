<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="The Corvane product loop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2f6"/>
      <stop offset="100%" stop-color="#e6edf3"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6f78" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#1f6f78" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1f6f78" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="18" fill="url(#bg)"/>
  <rect x="40" y="108" width="1120" height="3" rx="2" fill="url(#line)"/>
  <circle r="7" fill="#1f6f78">
    <animateMotion dur="8s" repeatCount="indefinite" path="M40,109.5 H1160"/>
  </circle>

  <!-- steps -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(70,36)">
      <rect width="220" height="148" rx="16" fill="#0f1c2e"/>
      <text x="22" y="38" fill="#a7d6d2" font-size="13" letter-spacing="2">01</text>
      <text x="22" y="74" fill="#f4f7fa" font-size="22" font-weight="700">Find the gap</text>
      <text x="22" y="104" fill="#d7e0ea" font-size="14">Hunt underserved</text>
      <text x="22" y="124" fill="#d7e0ea" font-size="14">markets with demand</text>
    </g>
    <g transform="translate(350,36)">
      <rect width="220" height="148" rx="16" fill="#132538"/>
      <text x="22" y="38" fill="#a7d6d2" font-size="13" letter-spacing="2">02</text>
      <text x="22" y="74" fill="#f4f7fa" font-size="22" font-weight="700">Build modern SaaS</text>
      <text x="22" y="104" fill="#d7e0ea" font-size="14">Clarity. Speed.</text>
      <text x="22" y="124" fill="#d7e0ea" font-size="14">Zero friction theater.</text>
    </g>
    <g transform="translate(630,36)">
      <rect width="220" height="148" rx="16" fill="#15545b"/>
      <text x="22" y="38" fill="#eef2f6" font-size="13" letter-spacing="2">03</text>
      <text x="22" y="74" fill="#f4f7fa" font-size="22" font-weight="700">Engage closely</text>
      <text x="22" y="104" fill="#d7e0ea" font-size="14">Customers in the loop,</text>
      <text x="22" y="124" fill="#d7e0ea" font-size="14">not the ticket queue</text>
    </g>
    <g transform="translate(910,36)">
      <rect width="220" height="148" rx="16" fill="#1f6f78"/>
      <text x="22" y="38" fill="#eef2f6" font-size="13" letter-spacing="2">04</text>
      <text x="22" y="74" fill="#f4f7fa" font-size="22" font-weight="700">Iterate forever</text>
      <text x="22" y="104" fill="#eef2f6" font-size="14">Ship. Learn. Refine.</text>
      <text x="22" y="124" fill="#eef2f6" font-size="14">Then do it again.</text>
    </g>
  </g>
</svg>
