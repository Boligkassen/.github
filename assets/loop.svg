<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-label="The Corvane product loop">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e6edf3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="220" rx="14" fill="url(#panel)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(40,40)">
      <rect width="265" height="140" rx="12" fill="#0f1c2e"/>
      <text x="24" y="34" fill="#a7d6d2" font-size="11" font-weight="600" letter-spacing="2.5">01</text>
      <text x="24" y="66" fill="#f4f7fa" font-size="18" font-weight="700">Find the gap</text>
      <text x="24" y="100" fill="#d7e0ea" font-size="13">Hunt underserved markets</text>
      <text x="24" y="120" fill="#d7e0ea" font-size="13">with clear demand</text>
    </g>
    <g transform="translate(325,40)">
      <rect width="265" height="140" rx="12" fill="#132538"/>
      <text x="24" y="34" fill="#a7d6d2" font-size="11" font-weight="600" letter-spacing="2.5">02</text>
      <text x="24" y="66" fill="#f4f7fa" font-size="18" font-weight="700">Build modern SaaS</text>
      <text x="24" y="100" fill="#d7e0ea" font-size="13">Focused software built for</text>
      <text x="24" y="120" fill="#d7e0ea" font-size="13">clarity and speed</text>
    </g>
    <g transform="translate(610,40)">
      <rect width="265" height="140" rx="12" fill="#15545b"/>
      <text x="24" y="34" fill="#d7e0ea" font-size="11" font-weight="600" letter-spacing="2.5">03</text>
      <text x="24" y="66" fill="#f4f7fa" font-size="18" font-weight="700">Engage closely</text>
      <text x="24" y="100" fill="#d7e0ea" font-size="13">Customers in the loop,</text>
      <text x="24" y="120" fill="#d7e0ea" font-size="13">not a ticket queue</text>
    </g>
    <g transform="translate(895,40)">
      <rect width="265" height="140" rx="12" fill="#1f6f78"/>
      <text x="24" y="34" fill="#eef2f6" font-size="11" font-weight="600" letter-spacing="2.5">04</text>
      <text x="24" y="66" fill="#f4f7fa" font-size="18" font-weight="700">Iterate forever</text>
      <text x="24" y="100" fill="#d7e0ea" font-size="13">Ship. Learn. Refine.</text>
      <text x="24" y="120" fill="#d7e0ea" font-size="13">Then do it again.</text>
    </g>
  </g>
  <line x1="310" y1="110.0" x2="320" y2="110.0" stroke="#1f6f78" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="315.0" cy="110.0" r="2.5" fill="#1f6f78"/>
  <line x1="595" y1="110.0" x2="605" y2="110.0" stroke="#1f6f78" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="600.0" cy="110.0" r="2.5" fill="#1f6f78"/>
  <line x1="880" y1="110.0" x2="890" y2="110.0" stroke="#1f6f78" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="885.0" cy="110.0" r="2.5" fill="#1f6f78"/>
</svg>
