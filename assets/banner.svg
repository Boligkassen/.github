<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Corvane  product-led software from Denmark">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1c2e"/>
      <stop offset="55%" stop-color="#132538"/>
      <stop offset="100%" stop-color="#15545b"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#1f6f78" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#1f6f78" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1f6f78" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#3a5169" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3a5169" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6f78" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a7d6d2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1f6f78" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#d7e0ea"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#d7e0ea" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect width="1200" height="420" fill="url(#glow2)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- orbit rings -->
  <g fill="none" stroke="#d7e0ea" stroke-opacity="0.14" stroke-width="1.2">
    <ellipse cx="960" cy="140" rx="210" ry="78">
      <animateTransform attributeName="transform" type="rotate" from="0 960 140" to="360 960 140" dur="48s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="140" rx="160" ry="54" stroke-opacity="0.22">
      <animateTransform attributeName="transform" type="rotate" from="180 960 140" to="540 960 140" dur="36s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- satellite dots -->
  <circle cx="1148" cy="140" r="4" fill="#a7d6d2">
    <animateTransform attributeName="transform" type="rotate" from="0 960 140" to="360 960 140" dur="48s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="140" r="3" fill="#f4f7fa" fill-opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="90 960 140" to="450 960 140" dur="36s" repeatCount="indefinite"/>
  </circle>

  <!-- accent mark -->
  <g transform="translate(72,78)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#1f6f78"/>
    <path d="M14 36V20h8.4c7.2 0 11.6 3.5 11.6 8.7 0 5.3-4.4 8.8-11.6 8.8H22.2V36H14zm8.2-13.2v7.5h2.1c3.5 0 5.5-1.5 5.5-3.8s-2-3.7-5.5-3.7h-2.1zM39 36l-6.8-16h8.2l2.5 7.6 2.5-7.6h8.1L46.7 36H39z" fill="#f4f7fa"/>
  </g>

  <text x="72" y="190" fill="url(#word)" font-family="Georgia, 'Times New Roman', serif" font-size="86" font-weight="700" letter-spacing="2">CORVANE</text>
  <rect x="72" y="214" width="280" height="2" fill="url(#beam)">
    <animate attributeName="width" values="120;420;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;1;0.45" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="72" y="268" fill="#d7e0ea" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500">
    Product-led software for industries that deserve better.
  </text>
  <text x="72" y="308" fill="#a7d6d2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" letter-spacing="3.5">
    DENMARK  ·  MODERN SAAS  ·  BUILT WITH CUSTOMERS
  </text>

  <!-- floating status chip -->
  <g transform="translate(860,300)">
    <rect width="260" height="54" rx="12" fill="#0f1c2e" fill-opacity="0.55" stroke="#a7d6d2" stroke-opacity="0.35"/>
    <circle cx="28" cy="27" r="6" fill="#1f6f78">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="48" y="24" fill="#f4f7fa" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">SYSTEM STATUS</text>
    <text x="48" y="42" fill="#a7d6d2" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Shipping continuously · Feedback online</text>
  </g>
</svg>
