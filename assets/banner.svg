<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Corvane - product-led software from Denmark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0%" stop-color="#0f1c2e"/>
      <stop offset="70%" stop-color="#132538"/>
      <stop offset="100%" stop-color="#15545b"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="38%">
      <stop offset="0%" stop-color="#1f6f78" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#1f6f78" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#d7e0ea"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a7d6d2"/>
      <stop offset="85%" stop-color="#a7d6d2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a7d6d2" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <g transform="translate(960,200)">
    <circle r="120" fill="none" stroke="#d7e0ea" stroke-opacity="0.10" stroke-width="1"/>
    <circle r="88" fill="none" stroke="#d7e0ea" stroke-opacity="0.14" stroke-width="1"/>
    <circle r="56" fill="none" stroke="#d7e0ea" stroke-opacity="0.20" stroke-width="1"/>
    <circle r="5" fill="#1f6f78"/>
      <circle cx="118.83" cy="16.70" r="3.5" fill="#a7d6d2">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="42s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-74.63" cy="46.63" r="3" fill="#a7d6d2">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-17.30" cy="-53.26" r="2.5" fill="#a7d6d2">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite"/>
      </circle>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(80,112)">
      <rect width="52" height="52" rx="13" fill="#1f6f78"/>
      <path d="M37.98,35.70 A14.5,14.5 0 1 1 37.98,16.30 L33.89,19.98 A9,9 0 1 0 33.89,32.02 Z" fill="#f4f7fa"/>
      <text x="72" y="26.0" dominant-baseline="central"
            fill="url(#word)" font-size="46" font-weight="700" letter-spacing="4"
            font-family="Georgia, 'Times New Roman', serif">CORVANE</text>
    </g>

    <rect x="80" y="192" width="327" height="2" fill="url(#rule)"/>
    <text x="80" y="237" fill="#d7e0ea" font-size="19" font-weight="400">Product-led software for industries that deserve better.</text>
    <g transform="translate(80,285)" fill="#a7d6d2" font-size="11" font-weight="600" letter-spacing="2.4">
      <text x="0" y="0">DENMARK</text>
      <circle cx="88" cy="-3.5" r="1.5" fill="#1f6f78"/>
      <text x="102" y="0">MODERN SAAS</text>
      <circle cx="224" cy="-3.5" r="1.5" fill="#1f6f78"/>
      <text x="238" y="0">BUILT WITH CUSTOMERS</text>
    </g>
  </g>
</svg>
